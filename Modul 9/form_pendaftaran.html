<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran</title>
</head>
<body>
    <h2>Form Pendaftaran Mahasiswa</h2>
    <form action="proses_pendaftaran.php" method="POST">
        Nim: <input type="text" name="nim"><br><br>
        Nama Lengkap: <input type="text" name="nama"><br><br>
        E-mail: <input type="email" name="email"><br><br>
        
        Tempat Lahir: <input type="text" name="tempat"> 
        Tanggal Lahir: <input type="date" name="ttl"><br><br>
        
        Alamat:<br>
        <textarea name="alamat" rows="4" cols="30"></textarea><br><br>
        
        Jenis Kelamin: 
        <input type="radio" name="gender" value="Laki-Laki"> Laki-Laki
        <input type="radio" name="gender" value="Perempuan"> Perempuan<br><br>
        
        <input type="submit" value="Kirim Data">
    </form>
</body>
</html>
